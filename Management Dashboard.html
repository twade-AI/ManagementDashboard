<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Haileybury — Management Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Brand fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Lato:wght@300;400;700;900&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Calluna Sans';
    src: url('fonts/CallunaSans-Light.otf') format('opentype');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Calluna Sans';
    src: url('fonts/CallunaSans-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Calluna Sans';
    src: url('fonts/CallunaSans-Italic.otf') format('opentype');
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: 'Calluna Sans';
    src: url('fonts/CallunaSans-Bold.otf') format('opentype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Calluna Sans', 'Lato', 'Source Sans 3', system-ui, sans-serif; color: #1a1613; }
  #root { height: 100%; }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 16px; bottom: 16px; width: 280px;
    background: #fff; border: 1px solid #e4ddd3; border-radius: 10px;
    padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08);
    z-index: 200; font-family: 'Lato', sans-serif; color: #1a1613;
    display: none;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-panel h3 {
    margin: 0 0 10px; font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tweaks-panel .close { cursor: pointer; border: none; background: transparent; font-size: 18px; color: #6e665f; }
  .tweak-row { margin-bottom: 10px; }
  .tweak-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: #6e665f; font-weight: 700; margin-bottom: 5px;
  }
  .tweak-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .tweak-btns button {
    border: 1px solid #e4ddd3; background: #fff; color: #3d3630;
    padding: 4px 9px; font-size: 11px; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-weight: 500;
  }
  .tweak-btns button.on {
    background: #9b1844; color: #fff; border-color: #9b1844;
  }
  .swatch-row { display: flex; gap: 6px; }
  .swatch-row button {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .swatch-row button.on { border-color: #1a1613; }
</style>

<!-- Pinned React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data + primitives + executive variation -->
<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx" data-presets="env,react"></script>
<script type="text/babel" src="variation-executive.jsx" data-presets="env,react"></script>

</head>
<body>
<div id="root"></div>

<!-- Tweaks defaults (host-persisted) -->
<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "magenta",
  "density": "roomy",
  "showRag": true
}/*EDITMODE-END*/;
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const ACCENT_SWATCHES = {
  magenta: { c: '#9b1844', name: 'Magenta' },
  royal:   { c: '#2a2b7c', name: 'Royal'   },
  green:   { c: '#009870', name: 'Green'   },
  orange:  { c: '#ec6608', name: 'Orange'  },
  blue:    { c: '#1e5b8a', name: 'Blue'    },
};

function TweaksPanel({ open, setOpen, tweaks, setTweaks }) {
  const set = (k, v) => setTweaks(t => ({ ...t, [k]: v }));
  return (
    <div className={"tweaks-panel " + (open ? 'open' : '')}>
      <h3>Tweaks <button className="close" onClick={() => setOpen(false)}>×</button></h3>

      <div className="tweak-row">
        <div className="tweak-label">Accent colour</div>
        <div className="swatch-row">
          {Object.entries(ACCENT_SWATCHES).map(([k, {c, name}]) => (
            <button key={k} title={name}
              className={tweaks.accent === k ? 'on' : ''}
              style={{ background: c }}
              onClick={() => set('accent', k)} />
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <div className="tweak-label">Density</div>
        <div className="tweak-btns">
          {['compact', 'cozy', 'roomy'].map(d => (
            <button key={d} className={tweaks.density === d ? 'on' : ''}
              onClick={() => set('density', d)}>{d}</button>
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <div className="tweak-label">RAG traffic lights</div>
        <div className="tweak-btns">
          <button className={tweaks.showRag ? 'on' : ''} onClick={() => set('showRag', true)}>Show</button>
          <button className={!tweaks.showRag ? 'on' : ''} onClick={() => set('showRag', false)}>Hide</button>
        </div>
      </div>
    </div>
  );
}

function useAccent(tweaks) {
  useEffect(() => {
    const c = ACCENT_SWATCHES[tweaks.accent]?.c || '#9b1844';
    document.documentElement.style.setProperty('--hb-magenta', c);
    const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; };
    const [r, g, b] = hex2rgb(c);
    const tint = (a) => `rgba(${r},${g},${b},${a})`;
    document.documentElement.style.setProperty('--hb-magenta-10', tint(0.08));
    document.documentElement.style.setProperty('--hb-magenta-30', tint(0.25));
    document.documentElement.style.setProperty('--hb-magenta-60', tint(0.5));
  }, [tweaks.accent]);
}

function useDensity(tweaks) {
  useEffect(() => {
    document.documentElement.dataset.density = tweaks.density;
  }, [tweaks.density]);
}

function useRagVisibility(tweaks) {
  useEffect(() => {
    let el = document.getElementById('rag-visibility-style');
    if (!el) { el = document.createElement('style'); el.id = 'rag-visibility-style'; document.head.appendChild(el); }
    el.textContent = tweaks.showRag ? '' : `
      .rag-dot, .rag-pill { display: none !important; }
    `;
  }, [tweaks.showRag]);
}

function useEditMode(setOpen) {
  useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setOpen(true);
      else if (e.data.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
}

function persistTweaks(edits) {
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
}

class SafeBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('[Variation error]', err, info); }
  render() {
    if (this.state.err) {
      return <div style={{ padding: 24, fontFamily: 'Lato, sans-serif', color: '#b0233b', fontSize: 13 }}>
        <strong>Couldn't render the dashboard.</strong>
        <pre style={{ fontSize: 10, whiteSpace: 'pre-wrap', marginTop: 8, color: '#6e665f' }}>{String(this.state.err)}</pre>
      </div>;
    }
    return this.props.children;
  }
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [open, setOpen] = useState(false);

  useAccent(tweaks);
  useDensity(tweaks);
  useRagVisibility(tweaks);
  useEditMode(setOpen);

  const update = (next) => {
    setTweaks(next);
    persistTweaks(next);
  };

  const Executive = window.ExecutiveBrief;

  return (
    <>
      <div style={{ width: '100vw', height: '100vh', overflow: 'auto' }}>
        <SafeBoundary>
          {Executive ? <Executive /> : <div style={{padding: 40}}>Loading…</div>}
        </SafeBoundary>
      </div>
      <TweaksPanel open={open} setOpen={setOpen} tweaks={tweaks}
        setTweaks={(fn) => update(typeof fn === 'function' ? fn(tweaks) : fn)} />
    </>
  );
}

function waitForReady(cb) {
  const check = () => {
    if (window.ExecutiveBrief && window.HBY && window.DASHBOARD_DATA) cb();
    else setTimeout(check, 30);
  };
  check();
}

waitForReady(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script>

</body>
</html>
